  sections:
    Profile:
      - bullet: >-
          Human factors researcher specializing in physiological computing, human-state assessment, and human–AI interaction. My research combines
          physiological and behavioral measures, experimental methods, statistical analysis, and machine learning to understand human states and
          experiences and to support the design and evaluation of usable, adaptive, and human-centered systems.

    Professional Experience:
      - bullet: "**Incoming Postdoctoral Researcher** — MUSE Lab., Hanyang University  \nExpected start: September 2026."
      - bullet: >-
          **Researcher** — Korea Automobile Testing & Research Institute (KATRI), Korea Transportation Safety Authority · July 2013–April 2016.
      - bullet: >-
          Contributed to the project “Development of Certification Standard and Test Procedure for the Motor Vehicle Tuning,” focusing on automotive
          lighting systems.
      - bullet: >-
          Conducted self-certification compliance investigations for motor vehicles and vehicle parts, focusing on automotive lighting systems.

    Academic Background:
      - bullet: >-
          **Ph.D. in Industrial and Management Engineering** — Hanyang University · September 2017–August 2026. Dissertation: Machine Learning-Based
          Classification of High-Risk Gaming Disorder Groups Using EEG Relative Power Following In-Game Kill/Death Events: Exploration of
          Neurophysiological Candidate Parameters. Advisors: Jeongeun Park and Jung-Yong Kim.
      - bullet: >-
          **Bachelor's degree in Mechanical Engineering** — Hanyang University ERICA · March 2007–August 2013. Second Major: Design Engineering.

