name: Personal site smoke test

on:
  push:
    branches:
      - main
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_bibliography/**"
      - "_data/**"
      - "_pages/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"
  pull_request:
    branches:
      - main
    paths:
      - "Gemfile"
      - "Gemfile.lock"
      - "_config.yml"
      - "_bibliography/**"
      - "_data/**"
      - "_pages/**"
      - "assets/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/unit-tests.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Setup Node 🧰
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install JS dependencies 📦
        run: npm ci

      - name: Install build prerequisites 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          pip3 install --upgrade nbconvert

      - name: Build production site 🏗️
        run: JEKYLL_ENV=production bundle exec jekyll build

      - name: Verify personal site output 🔎
        run: |
          set -euo pipefail

          for output in \
            index.html \
            research/index.html \
            projects/index.html \
            publications/index.html \
            cv/index.html; do
            test -f "_site/${output}"
          done

          test ! -e _site/al-folio/index.html

          sitemap_count="$(grep -o '<url>' _site/sitemap.xml | wc -l | tr -d ' ')"
          test "${sitemap_count}" -eq 5

          for url in \
            'https://ofsungkyun.github.io/' \
            'https://ofsungkyun.github.io/research/' \
            'https://ofsungkyun.github.io/projects/' \
            'https://ofsungkyun.github.io/publications/' \
            'https://ofsungkyun.github.io/cv/'; do
            grep -Fq "<loc>${url}</loc>" _site/sitemap.xml
          done

          if grep -R -I -q -i -E \
            --include='*.html' \
            --include='*.xml' \
            --include='*.json' \
            'Albert Einstein|Princeton University|The Godfather|project [1-9]' \
            _site; then
            echo "Unexpected al-folio demo content found in generated output." >&2
            exit 1
          fi

          if grep -R -I -q -E \
            --include='*.html' \
            '(href|src)="/al-folio/' \
            _site; then
            echo "Unexpected /al-folio/ baseurl found in generated output." >&2
            exit 1
          fi

          echo "Personal site smoke checks passed."
